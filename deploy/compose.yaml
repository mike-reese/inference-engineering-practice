name: "ie-i01-l2"
volumes:
  prometheus-data: {}
services:
  server:
    image: "ie-llama-cpp-server:b6500-cuda12.4-sm61"
    ports:
      - "127.0.0.1::8080"
    pull_policy: never
    command:
      - "--model"
      - "/model/model.gguf"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "--ctx-size"
      - "4096"
      - "--parallel"
      - "1"
      - "--temp"
      - "0"
      - "--seed"
      - "0"
      - "--n-gpu-layers"
      - "99"
      - "--metrics"
      - "-lv"
      - "1"
      - "--log-timestamps"
      - "--log-prefix"
      - "--log-file"
      - "/logs/${RUN_ID:?}_s${SERVER_START:?}.log"
    volumes:
      - "${HOME}/.local/share/telos-models/qwen2.5-0.5b-instruct-f32/Qwen2.5-0.5B-Instruct-f32.gguf:/model/model.gguf:ro"
      - "../reps/I01-L2_chat_service_under_load/results/${RUN_ID:?}:/logs"
    gpus: "all"
    devices:
      - "/dev/nvidia-uvm:/dev/nvidia-uvm"
      - "/dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools"
    mem_limit: 8g
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
  capture:
    build:
      context: ./capture
    image: "ie-capture:alpine3.20"
    network_mode: "service:server"
    cap_drop: ["ALL"]
    cap_add: ["NET_RAW"]
    depends_on: ["server"]
    command: ["tcpdump", "-i", "eth0", "-p", "-n", "-s", "0", "-U", "--time-stamp-precision=nano", "-w", "/cap/${RUN_ID:?}_s${SERVER_START:?}.pcap", "tcp port 8080"]
    volumes:
      - "../reps/I01-L2_chat_service_under_load/results/${RUN_ID:?}:/cap"
    mem_limit: 256m
  client:
    build:
      context: ..
      dockerfile: "deploy/client/Dockerfile"
    image: "ie-client:i01-l2"
    environment:
      SERVER_BASE_URL: "http://server:8080/v1"
      CONTROL_DIR: "/control"
      RECORDS_DIR: "/records"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - "../reps/I01-L2_chat_service_under_load/results/${RUN_ID:?}/control:/control:ro"
      - "../reps/I01-L2_chat_service_under_load/results/${RUN_ID:?}/client:/records"
    ports:
      - "127.0.0.1::9410"
    mem_limit: 512m
  prometheus:
    image: "prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2h"
      - "--storage.tsdb.retention.size=128MB"
    volumes:
      - "../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "../monitoring/rules.yml:/etc/prometheus/rules.yml:ro"
      - "prometheus-data:/prometheus"
    ports:
      - "127.0.0.1::9090"
    mem_limit: 512m 
  node:
    image: "prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0"
    pid: host
    uts: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.loadavg"
      - "--collector.uname"
      - "--collector.stat"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/host/root:ro,rslave"
    ports:
      - "127.0.0.1::9100"
    mem_limit: 128m
  dcgm:
    image: "nvidia/dcgm-exporter:4.3.1-4.4.1-ubuntu22.04@sha256:64f322a826599664a1fe5ea4e3f76b7b0984142050e7047d63ae1d6687b4b1aa"
    gpus: "all"
    devices:
      - "/dev/nvidia-uvm:/dev/nvidia-uvm"
      - "/dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools"
    command: ["-c", "1000", "-f", "/etc/dcgm-exporter/selected.csv"]
    volumes:
      - "../monitoring/dcgm.csv:/etc/dcgm-exporter/selected.csv:ro"
    ports:
      - "127.0.0.1::9400"
    mem_limit: 1g
  grafana:
    image: "grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - "../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro"
      - "../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro"
      - "../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports:
      - "127.0.0.1::3000"
    mem_limit: 1g
