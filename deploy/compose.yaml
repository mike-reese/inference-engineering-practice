name: "ie-i01-l2"
services:
  server:
    image: "ie-tensorrt-llm:1.2.1-nvml-byref"
    ports:
      - "127.0.0.1::8080"
    pull_policy: never
    command:
      - "trtllm-serve"
      - "serve"
      - "/model"
      - "--backend"
      - "pytorch"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--max_batch_size"
      - "1"
      - "--max_seq_len"
      - "2048"
      - "--config"
      - "/config/config.yaml"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - "${MODEL_DIR:-${HOME}/.local/share/inference-engineering/models/Qwen2.5-0.5B-Instruct/7ae557604adf67be50417f59c2c2f167def9a775}:/model:ro"
      - "${RESULTS_DIR:?}/${RUN_ID:?}:/config:ro"
    gpus: "all"
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 2s
      retries: 3
      start_period: 120s
      start_interval: 1s   # Docker probes at start_interval (default 5 s) during start_period; 5 s added up to 4.8 s to every cold start
  capture:
    build:
      context: ./capture
    image: "ie-capture:alpine3.20"
    network_mode: "service:server"
    cap_drop: ["ALL"]
    cap_add: ["NET_RAW"]
    depends_on: ["server"]
    command: ["tcpdump", "--immediate-mode", "-i", "eth0", "-p", "-n", "-s", "0", "-U", "--time-stamp-precision=nano", "-w", "/cap/${RUN_ID:?}_s${SERVER_START:?}.pcap", "tcp port 8080"]
    volumes:
      - "${RESULTS_DIR:?}/${RUN_ID:?}:/cap"
    mem_limit: 256m
  # Host CPU, RAM, L3 and RAM bandwidth, NVMe I/O and the server container's process starts, read every 100 ms into
  # the run folder's trackers/ (deploy/trackers/trackers.py). In the server's PID namespace, so its pids are the
  # ones the profilers and stamps record. CAP_PERFMON lets perf read the uncore counters without the host sysctl.
  trackers:
    build:
      context: ./trackers
    image: "ie-trackers:alpine3.20"
    pid: "service:server"
    network_mode: "none"
    cap_drop: ["ALL"]
    cap_add: ["PERFMON"]
    depends_on: ["server"]
    environment:
      NVME_MODEL: "SN7100"
    command: ["python3", "-u", "/trackers.py", "/out"]
    volumes:
      - "${RESULTS_DIR:?}/${RUN_ID:?}/trackers:/out"
    mem_limit: 256m
  client:
    build:
      context: ..
      dockerfile: "deploy/client/Dockerfile"
    image: "ie-client:i01-l2"
    environment:
      SERVER_BASE_URL: "http://server:8080/v1"
      CONTROL_DIR: "/control"
      RECORDS_DIR: "/records"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - "${RESULTS_DIR:?}/${RUN_ID:?}/control:/control:ro"
      - "${RESULTS_DIR:?}/${RUN_ID:?}/client:/records"
    ports:
      - "127.0.0.1::9410"
    mem_limit: 512m
# Monitoring (Prometheus, Grafana, node and DCGM exporters) runs in the devtools project (deploy/devtools.yaml):
# it outlives each rep's `compose down` and scrapes whichever engine is up.
