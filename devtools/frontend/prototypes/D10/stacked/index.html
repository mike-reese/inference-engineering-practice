<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D10 Stacked World</title>
<link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  :root { --bg:#070a10; --panel:#0d131dee; --line:#263041; --fg:#d6dfeb; --mute:#7f8ea3;
    --exec:#ffb347; --hw:#5fd4a4; --arch:#7cb8ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:34px 0 0 0; }
  .lbl { font:600 13px system-ui; color:#e8eef6; background:#0b1018cc; border:1px solid #2a3547; padding:2px 7px;
    border-radius:5px; white-space:nowrap; pointer-events:none; transition:opacity .3s; }
  .lbl.hw { border-color:#2f6b55; } .lbl.arch { border-color:#35547d; } .lbl.exec { border-color:#a8742a; color:#ffd9a0; font-size:14px; }
  .lbl.on { background:#1d2a3d; color:#fff; } .lbl.hw.on { border-color:var(--hw); } .lbl.arch.on { border-color:var(--arch); }
  .lbl.dim { opacity:.4; }
  .lbl.big { font-size:15px; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; z-index:10; }
  #focus { top:46px; left:14px; width:280px; }
  #focus h1 { margin:0 0 4px; font-size:20px; } #focus .cap { color:var(--mute); line-height:1.4; font-size:13.5px; }
  #ladders { top:190px; left:14px; width:280px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  #ladders .col h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  #ladders .col div { font-size:12px; padding:3px 5px; border-radius:4px; color:var(--mute); margin-bottom:2px; }
  #ladders .col div.al { outline:1px dashed #4a5870; color:#b8c4d4; }
  #ladders .col div.f { color:#08101a; font-weight:700; }
  #now { top:46px; right:14px; width:390px; }
  #now h2 { margin:0 0 8px; font-size:15px; color:var(--mute); }
  #now .sec { margin-bottom:10px; padding-left:9px; border-left:3px solid; }
  #now .sec b { display:block; font-size:12.5px; letter-spacing:.06em; margin-bottom:3px; }
  #now .sec div { font-size:13.5px; line-height:1.45; }
  #now .sec .k { color:var(--mute); }
  #now .sec.focus { background:#ffffff0a; border-radius:0 6px 6px 0; }
  .bar { display:inline-block; width:90px; height:8px; background:#1b2433; border-radius:4px; vertical-align:middle; margin:0 6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--hw); }
  #tl { position:fixed; left:14px; right:14px; bottom:12px; height:58px; z-index:10; padding:6px 12px; }
  #tl .row { position:relative; height:26px; margin-top:4px; cursor:pointer; }
  #tl .spark { position:absolute; inset:0; display:flex; align-items:flex-end; opacity:.45; }
  #tl .spark i { flex:1; background:var(--hw); margin-right:1px; }
  #tl .tick { position:absolute; top:2px; bottom:2px; width:2px; margin-left:-1px; }
  #tl .cur { position:absolute; top:-4px; bottom:-4px; width:3px; margin-left:-1.5px; background:#fff; box-shadow:0 0 8px #fff; }
  #tl .hd { font-size:12.5px; color:var(--mute); display:flex; justify-content:space-between; }
  #tl .hd span b { color:var(--fg); }
  #keys { bottom:84px; left:14px; width:280px; font-size:12px; color:var(--mute); line-height:1.6; }
  #keys kbd { color:var(--fg); font:600 12px ui-monospace, monospace; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="focus" class="panel"><h1></h1><div class="cap"></div></div>
<div id="ladders" class="panel"></div>
<div id="now" class="panel"></div>
<div id="keys" class="panel"></div>
<div id="tl" class="panel"><div class="hd"><span class="a"></span><span class="b"></span></div><div class="row"><div class="spark"></div></div></div>
<script type="module" src="./stacked.js"></script>
</body>
</html>
