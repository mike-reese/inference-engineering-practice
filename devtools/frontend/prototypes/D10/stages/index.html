<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Three Stages</title>
<style>
  :root { --bg:#070a10; --panel:#0e1420ee; --line:#263041; --text:#d6deea; --dim:#7d8ca3; --exec:#7cc4ff; --hw:#ffb15c; --arch:#b892ff; --hot:#ffd84a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.35 system-ui, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:34px 0 64px 0; }
  #labels { position:fixed; inset:34px 0 64px 0; pointer-events:none; }
  .lbl { font-size:14px; color:#e8eef7; background:#0b1019cc; padding:2px 7px; border-radius:5px; white-space:nowrap; border:1px solid #2a3547; }
  .lbl.big { font-size:17px; font-weight:600; }
  .lbl.title { font-size:20px; font-weight:700; letter-spacing:.04em; background:none; border:none; text-transform:uppercase; }
  .lbl.hot { border-color:var(--hot); color:#fff; box-shadow:0 0 0 1px var(--hot); }
  .lbl.soft { color:var(--dim); background:none; border:none; font-size:13px; }
  #focus { position:fixed; top:46px; left:16px; z-index:10; font-size:26px; font-weight:700; }
  #focus small { display:block; font-size:14px; font-weight:400; color:var(--dim); margin-top:2px; }
  #ladders { position:fixed; top:110px; left:16px; z-index:10; display:flex; gap:10px; }
  .ladder { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:120px; }
  .ladder h4 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
  .ladder div { font-size:14px; color:#5d6b80; padding:1px 4px; border-radius:4px; }
  .ladder div.on { color:#0b0f16; font-weight:700; }
  .ladder.focus { border-color:#56657c; }
  #now { position:fixed; top:46px; right:16px; z-index:10; width:470px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; }
  #now h4 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  #now .row { margin:6px 0; } #now .row b { display:inline-block; width:105px; }
  #now .row span { color:#e8eef7; }
  #tl { position:fixed; left:0; right:0; bottom:0; height:64px; background:#0b0f16; border-top:1px solid var(--line); cursor:pointer; }
  #tl canvas { width:100%; height:100%; display:block; }
  #help { position:fixed; bottom:72px; left:16px; z-index:10; color:var(--dim); font-size:13px; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div><div id="labels"></div>
<div id="focus"></div>
<div id="ladders"></div>
<div id="now"></div>
<div id="help">← → stop · Shift coarser stop · ↑ ↓ fly tier · E H A swing to a stage · 1-6 tier · Space play · click timeline to seek</div>
<div id="tl"><canvas></canvas></div>
<script type="module" src="./stages.js"></script>
</body>
</html>
