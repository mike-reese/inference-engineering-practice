global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: server
    static_configs:
      - targets: ["server:8080"]
  - job_name: client
    static_configs:
      - targets: ["client:9410"]
  - job_name: node
    static_configs:
      - targets: ["node:9100"]
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm:9400"]
