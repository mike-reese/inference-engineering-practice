# What the devtools runner (scripts/runner.py) may run for this rep. It runs only these commands, from the repo root,
# with these arguments: nothing typed in the browser reaches a shell. "{rep}" is this folder, relative to the repo.
id = "I02A-L1"
title = "Streamed latency"
spec = "README.md"
# The runner refuses to start while a container of these projects exists (a run from the terminal, a stuck stack).
compose_projects = ["ie-i02a-l1", "ie-i02a-l1-test"]
# Progress a profiler prints in a container's log rather than in rep.py's output: the Run tab shows the newest match.
[progress_log]
service = "server"
pattern = '==PROF== Profiling "([^"]+)" - (\d+)'
label = "Nsight Compute: kernel {2} ({1})"

[[actions]]
id = "off"
group = "run"
label = "Measured run"
description = "One warm-up and one measured streamed request. Client, wire and engine times; no profiler."
measured = true
graphs = true
minutes = 2
command = ["uv", "run", "--no-sync", "python", "{rep}/rep.py", "--trace", "off", "--progress", "json"]

[[actions]]
id = "timeline"
group = "run"
label = "Timeline (Nsight Systems)"
description = "Every kernel, copy and executor iteration on the run clock, CUDA graphs on. About 20-40% slower."
measured = false
graphs = true
minutes = 4
command = ["uv", "run", "--no-sync", "python", "{rep}/rep.py", "--trace", "timeline", "--progress", "json"]

[[actions.options]]
id = "profile_range"
label = "Profile range"
arg = "--profile-range"
pattern = '^\d{1,3}-\d{1,3}$'
default = "1-129"
description = "Executor iterations to record, first-last (/perf_metrics numbering): warm-up 1-64, measured request 66-129."

[[actions]]
id = "code"
group = "run"
label = "Code (PyTorch profiler)"
description = "Each kernel with the op, tensor shapes and Python stack that launched it. CUDA graphs off; about 50x slower per token."
measured = false
graphs = false
minutes = 6
command = ["uv", "run", "--no-sync", "python", "{rep}/rep.py", "--trace", "code", "--progress", "json"]

[[actions.options]]
id = "profile_range"
label = "Profile range"
arg = "--profile-range"
pattern = '^\d{1,3}-\d{1,3}$'
default = "66-129"
description = "Executor iterations to record, first-last: the measured request is 66 (prefill) to 129."

[[actions]]
id = "kernels"
group = "run"
label = "Kernels (Nsight Compute)"
description = "Every kernel of the chosen iterations, each replayed many times for its counters. CUDA graphs on. Not on the run clock."
measured = false
graphs = true
minutes = 15
command = ["uv", "run", "--no-sync", "python", "{rep}/rep.py", "--trace", "kernels", "--progress", "json"]

[[actions.options]]
id = "profile_range"
label = "Profile range"
arg = "--profile-range"
pattern = '^\d{1,3}-\d{1,3}$'
default = "67-67"
description = "Executor iterations to profile, at most 3: 66 is the prefill, 67-129 the decode steps. About 13 minutes per iteration with the full set."

[[actions.options]]
id = "ncu_set"
label = "Section set"
arg = "--ncu-set"
choices = ["full", "detailed", "basic", "memory"]
default = "full"
description = "full: every section and rule (41 passes per kernel). memory: speed of light, memory workload, source counters (12 passes). basic and detailed: ncu's own sets."

[[actions.options]]
id = "ncu_cache"
label = "Cache control"
arg = "--ncu-cache"
choices = ["all", "none"]
default = "all"
description = "all: flush the caches before every pass, so each pass starts cold and repeats. none: keep them warm, closer to the real run, less repeatable."

[[actions.options]]
id = "ncu_clock"
label = "Clock control"
arg = "--ncu-clock"
choices = ["base", "none"]
default = "base"
description = "base: lock the GPU to its base clock (2.39 GHz in our report), so results repeat. none: the GPU's own clocks (2.74 GHz in the measured run)."

[[actions]]
id = "nographs"
group = "run"
label = "No graphs (no profiler)"
description = "Same request with CUDA graphs off and no profiler: against a measured run it shows what graphs save."
measured = false
graphs = false
minutes = 3
command = ["uv", "run", "--no-sync", "python", "{rep}/rep.py", "--trace", "nographs", "--progress", "json"]

[[actions]]
id = "live"
group = "run"
label = "Live (engine iteration stats)"
description = "The measured run's setup plus the engine's iteration stats (batch, KV blocks, queue, iteration time), streamed to the Engine view. No profiler; labeled not measured."
measured = false
graphs = true
minutes = 2
command = ["uv", "run", "--no-sync", "python", "{rep}/rep.py", "--trace", "live", "--progress", "json"]

[[actions]]
id = "check"
group = "check"
label = "Pass check (5 checks)"
description = "make check: the five pass checks on a fresh stack (project ie-i02a-l1-test)."
minutes = 3
command = ["uv", "run", "--no-sync", "pytest", "-q", "{rep}/test_i02a_l1.py"]

[[actions]]
id = "k4"
group = "check"
label = "K4: break check 1 on purpose"
description = "Default skip_special_tokens against false: the token-count check fails, then passes."
minutes = 3
command = ["uv", "run", "--no-sync", "python", "{rep}/rep.py", "--k4"]

[[actions]]
id = "source"
group = "check"
label = "Where each engine time is stamped"
description = "Reads the installed TensorRT-LLM source for the six /perf_metrics stamps (K18)."
minutes = 1
command = ["uv", "run", "--no-sync", "python", "{rep}/rep.py", "--source"]
